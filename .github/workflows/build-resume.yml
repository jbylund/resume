name: Build resume

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - resume.bib
      - makefile
      - texmf/**
      - .github/workflows/build-resume.yml
  pull_request:
    paths:
      - "**.tex"
      - resume.bib
      - makefile
      - texmf/**
      - .github/workflows/build-resume.yml
  # so the PDF can be refreshed when the "Last updated <month>" line rolls over
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # normally about 90 seconds. The default is 360 minutes, long enough that a
    # hung apt sits there until someone notices and cancels it by hand.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        # normally ~45s, so 3 minutes is four times the headroom. Retries cover a
        # flaky mirror; the timeout turns a hang into a fast failure. Kept below the
        # job budget so a stuck install fails here, with a clear step name, rather
        # than as a job-level timeout.
        timeout-minutes: 3
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Dpkg::Use-Pty=0
        run: |
          sudo apt-get $APT_OPTS update -qq
          # xetex: xelatex, fontspec, geometry, hyperref, xcolor; fonts-lato: the
          # Lato TTFs \setmainfont needs. Everything else (enumitem, datetime,
          # pzdr.tfm) is vendored in texmf/, which keeps texlive-latex-extra,
          # -fonts-extra and -fonts-recommended -- 834MB of downloads -- out of
          # this job. See texmf/README.md.
          # poppler-utils supplies pdfinfo/pdftotext for the length check below
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y --no-install-recommends \
            texlive-xetex fonts-lato poppler-utils

      - name: Build PDF
        run: |
          # so xelatex resolves \setmainfont{Lato} to the fonts-lato TTFs
          export OSFONTDIR=/usr/share/fonts
          # Pin the timestamp to the start of the current month so builds are
          # byte-reproducible: the only date the resume shows is "Last updated
          # <month>, <year>", so nothing but a content change should produce a diff.
          export SOURCE_DATE_EPOCH="$(date -u -d "$(date -u +%Y-%m-01)" +%s)"
          export FORCE_SOURCE_DATE=1
          make

      - name: Check length
        run: |
          # The type scale is set to fill three pages almost exactly, which leaves
          # about a line of headroom -- so adding a bullet can silently produce a
          # fourth page. Fail instead, loudly. Fewer pages is fine: pruning content
          # should not need a workflow edit.
          MAX_PAGES=3
          pages="$(pdfinfo joseph_bylund.pdf | awk '/^Pages:/ {print $2}')"

          # how far down the final page the text reaches, as a percentage of the
          # text block -- reported so the slack left is visible in the run summary
          read -r height ymax <<<"$(pdftotext -bbox -f "$pages" -l "$pages" joseph_bylund.pdf - \
            | awk -F'"' '/<page /{h=$4} /yMax=/{for(i=1;i<=NF;i++) if($i ~ /yMax=/){v=$(i+1)+0; if(v>m) m=v}} END{print h, m}')"
          fill="$(awk -v y="$ymax" -v h="$height" 'BEGIN{printf "%.0f", (y - 52) / (h - 104) * 100}')"

          echo "$pages pages; final page $fill% full" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$pages" -gt "$MAX_PAGES" ]; then
            echo "::error::Resume is $pages pages, over the $MAX_PAGES-page limit." \
                 "Either prune content or lower \\scalepct in resume_zero_start.tex."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: joseph_bylund-pdf
          path: joseph_bylund.pdf
          if-no-files-found: error

      - name: Commit rebuilt PDF
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- joseph_bylund.pdf; then
            echo "PDF unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because .gitignore lists *.pdf, though this one is tracked
          git add -f joseph_bylund.pdf
          git commit -m "Rebuild resume PDF from ${GITHUB_SHA::7}"
          git push || { git pull --rebase && git push; }
